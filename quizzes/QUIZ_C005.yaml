quiz_id: 101
video_url: https://www.youtube.com/watch?v=bOiYLKX9ZRY
title: 'GCSE Chemistry: Hydrocarbons and Cracking'
multiple_choice:
- question_num: 1
  text: What type of reaction is cracking?
  A: Neutralisation
  B: Thermal decomposition
  C: Combustion
  D: Addition
  answer: Thermal decomposition
  points: 1
  explanation: Cracking is a thermal decomposition reaction because it uses heat to
    break down large molecules into smaller ones.
- question_num: 2
  text: Why are long-chain alkanes less useful than short-chain alkanes?
  A: They are too flammable
  B: They are gases at room temperature
  C: They are thick and viscous
  D: They contain double bonds
  answer: They are thick and viscous
  points: 1
  explanation: Long-chain alkanes have high viscosity and low flammability, making
    them poor fuels compared to shorter-chain alkanes.
- question_num: 3
  text: What are the products of cracking a long-chain alkane?
  A: Only shorter-chain alkanes
  B: Shorter-chain alkanes and alkenes
  C: Alkenes and water
  D: Carbon dioxide and water
  answer: Shorter-chain alkanes and alkenes
  points: 1
  explanation: Cracking breaks down long alkanes into a mixture of shorter alkanes
    and alkenes.
- question_num: 4
  text: Which catalyst is used in catalytic cracking?
  A: Iron
  B: Copper oxide
  C: Aluminum oxide
  D: Nickel
  answer: Aluminum oxide
  points: 1
  explanation: Catalytic cracking uses a hot powdered aluminum oxide catalyst to speed
    up the decomposition process.
- question_num: 5
  text: What is the defining feature of an alkene?
  A: Only single carbon-carbon bonds
  B: At least one carbon-carbon double bond
  C: They are saturated
  D: They contain only hydrogen atoms
  answer: At least one carbon-carbon double bond
  points: 1
  explanation: Alkenes are unsaturated hydrocarbons characterized by the presence
    of at least one carbon-carbon double bond.
- question_num: 6
  text: Why are alkenes described as unsaturated?
  A: They contain the maximum number of hydrogen atoms possible
  B: They contain only single bonds
  C: They contain a double bond and fewer hydrogen atoms than the corresponding alkane
  D: They are highly flammable
  answer: They contain a double bond and fewer hydrogen atoms than the corresponding
    alkane
  points: 1
  explanation: Unsaturated means the molecule could potentially bond with more hydrogen
    atoms if the double bond were broken.
- question_num: 7
  text: What is the result of adding bromine water to an alkene?
  A: The solution turns from orange to colorless
  B: The solution turns from colorless to orange
  C: No reaction occurs
  D: The solution turns blue
  answer: The solution turns from orange to colorless
  points: 1
  explanation: Bromine water reacts with the carbon-carbon double bond in alkenes,
    causing the orange color to disappear.
- question_num: 8
  text: What happens when bromine water is added to an alkane?
  A: The solution turns colorless
  B: The solution turns orange
  C: No reaction occurs and the solution remains orange
  D: A gas is produced
  answer: No reaction occurs and the solution remains orange
  points: 1
  explanation: Alkanes are saturated and do not react with bromine water, so the color
    does not change.
- question_num: 9
  text: Which of the following is a primary method of cracking?
  A: Fractional distillation
  B: Steam cracking
  C: Combustion
  D: Polymerisation
  answer: Steam cracking
  points: 1
  explanation: The two primary methods of cracking are catalytic cracking and steam
    cracking.
- question_num: 10
  text: Why are alkenes more reactive than alkanes?
  A: They have more carbon atoms
  B: They are saturated
  C: They contain a carbon-carbon double bond
  D: They are longer chains
  answer: They contain a carbon-carbon double bond
  points: 1
  explanation: The carbon-carbon double bond is a site of high electron density, making
    alkenes more reactive than alkanes.
- question_num: 11
  text: What must be true when balancing a cracking equation?
  A: The number of molecules must be equal on both sides
  B: The total number of carbon and hydrogen atoms must be equal on both sides
  C: Only the number of carbon atoms must be equal
  D: The temperature must be the same on both sides
  answer: The total number of carbon and hydrogen atoms must be equal on both sides
  points: 1
  explanation: Conservation of mass dictates that atoms cannot be created or destroyed,
    so the total count must remain constant.
- question_num: 12
  text: What are alkenes primarily used for in industry?
  A: As a source of oxygen
  B: To produce polymers
  C: To make saturated fats
  D: As a catalyst
  answer: To produce polymers
  points: 1
  explanation: Alkenes are essential starting materials for the production of polymers
    and various industrial chemicals.
- question_num: 13
  text: What is the state of long-chain alkanes at room temperature?
  A: Gases
  B: Thick, viscous liquids
  C: Solid metals
  D: Highly volatile liquids
  answer: Thick, viscous liquids
  points: 1
  explanation: As chain length increases, intermolecular forces increase, making long-chain
    alkanes thick and viscous.
- question_num: 14
  text: What is the main difference between steam cracking and catalytic cracking?
  A: Steam cracking uses a catalyst
  B: Catalytic cracking uses steam
  C: Steam cracking uses very high temperatures and steam instead of a catalyst
  D: Catalytic cracking does not require heat
  answer: Steam cracking uses very high temperatures and steam instead of a catalyst
  points: 1
  explanation: Steam cracking relies on high temperatures and steam, whereas catalytic
    cracking uses a catalyst to lower the required energy.
- question_num: 15
  text: Which term describes alkanes?
  A: Unsaturated
  B: Saturated
  C: Reactive
  D: Double-bonded
  answer: Saturated
  points: 1
  explanation: Alkanes contain only single bonds between carbon atoms, meaning they
    are saturated with hydrogen.
long_answer:
  question_num: 1
  text: Explain the process of cracking long-chain hydrocarbons and describe how you
    would distinguish between an alkane and an alkene in a laboratory setting.
  points: 6
  rubric: 'Level 1 (1-2 marks): Identifies that cracking breaks down large molecules.
    Mentions bromine water test but lacks detail.

    Level 2 (3-4 marks): Describes the process of cracking (heat/catalyst) and correctly
    identifies the products. Explains the bromine water test result for one substance.

    Level 3 (5-6 marks): Provides a detailed explanation of cracking (thermal decomposition,
    heat/catalyst, products). Clearly explains the bromine water test for both alkanes
    (no change) and alkenes (orange to colorless) with scientific reasoning regarding
    the double bond.'
